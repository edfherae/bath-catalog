services:
    nginx:
        image: nginx:1.27-alpine
        container_name: bath_nginx
        ports:
            - "8080:80"
        volumes:
            - ./public:/var/www/html/public:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php
        networks:
            - bath_net

    php:
        user: www-data
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: bath_php
        volumes:
            - .:/var/www/html
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            DATABASE_URL: "mysql://bath:bath@mysql:3306/bath_projects?serverVersion=8.0&charset=utf8mb4"
        networks:
            - bath_net

    mysql:
        image: mysql:8.0
        container_name: bath_mysql
        ports:
            - "3307:3306"
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: bath_projects
            MYSQL_USER: bath
            MYSQL_PASSWORD: bath
        volumes:
            - mysql_data:/var/lib/mysql
            - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test:
                [
                    "CMD",
                    "mysqladmin",
                    "ping",
                    "-h",
                    "localhost",
                    "-uroot",
                    "-proot",
                ]
            interval: 10s
            timeout: 30s
            retries: 15
            start_period: 180s
        networks:
            - bath_net

volumes:
    mysql_data:

networks:
    bath_net:
        driver: bridge
